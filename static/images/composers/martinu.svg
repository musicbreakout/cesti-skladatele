<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bg-BM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#EDE4D6"/>
      <stop offset="100%" stop-color="#DFD4C3"/>
    </linearGradient>
    <radialGradient id="vignette-BM" cx="50%" cy="40%" r="55%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#182E28" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-BM)"/>
  <rect width="100%" height="100%" fill="url(#vignette-BM)"/>
  <!-- Classical borders -->
  <rect x="14" y="14" width="372" height="452" rx="8" fill="none" stroke="#8C775E" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="20" y="20" width="360" height="440" rx="6" fill="none" stroke="#8C775E" stroke-width="0.8" stroke-dasharray="4 2"/>
  
  <!-- Sheet music watermark lines -->
  <g opacity="0.18" stroke="#182E28" stroke-width="1">
    <line x1="30" y1="90" x2="370" y2="90"/>
    <line x1="30" y1="98" x2="370" y2="98"/>
    <line x1="30" y1="106" x2="370" y2="106"/>
    <line x1="30" y1="114" x2="370" y2="114"/>
    <line x1="30" y1="122" x2="370" y2="122"/>
  </g>

  <!-- Composer Silhouette & Oval Portrait Frame -->
  <ellipse cx="200" cy="205" rx="120" ry="145" fill="#F5EFE6" stroke="#8C775E" stroke-width="3"/>
  <ellipse cx="200" cy="205" rx="114" ry="139" fill="none" stroke="#8C775E" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Stylized Classical Silhouette Bust -->
  <g fill="#182E28" opacity="0.9">
    <!-- Head & Hair -->
    <path d="M 170 120 Q 200 100 230 120 Q 255 140 245 180 Q 235 220 200 225 Q 165 220 155 180 Q 145 140 170 120 Z"/>
    <!-- Collar & Tie / Jabot -->
    <path d="M 160 220 L 240 220 L 265 270 L 285 330 L 115 330 L 135 270 Z" fill="#223F37"/>
    <path d="M 190 220 L 210 220 L 218 275 L 200 295 L 182 275 Z" fill="#FAF6F0"/>
    <path d="M 195 230 L 205 230 L 202 265 L 198 265 Z" fill="#C27845"/>
    <!-- Suit Shoulders -->
    <path d="M 115 330 C 130 270 170 240 200 240 C 230 240 270 270 285 330 C 260 340 140 340 115 330 Z" fill="#182E28"/>
  </g>

  <!-- Classical Clef Watermark in Center -->
  <text x="200" y="210" text-anchor="middle" font-family="'Playfair Display', serif" font-size="110" fill="#8C775E" opacity="0.25" font-weight="bold">𝄞</text>

  <!-- Monogram seal -->
  <circle cx="200" cy="335" r="28" fill="#182E28" stroke="#8C775E" stroke-width="2"/>
  <text x="200" y="342" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" fill="#F5EFE6" font-weight="bold">BM</text>

  <!-- Name & Typography -->
  <text x="200" y="390" text-anchor="middle" font-family="'Playfair Display', serif" font-size="23" font-weight="bold" fill="#182E28" letter-spacing="0.5">Bohuslav Martinů</text>
  <text x="200" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#C27845" letter-spacing="1">1890 – 1959</text>
  <text x="200" y="438" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#48524E">Světoobčan z rodné věže</text>
</svg>