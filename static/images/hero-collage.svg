<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <defs>
    <radialGradient id="hero-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="70%" stop-color="#EDE4D6"/>
      <stop offset="100%" stop-color="#DFD4C3"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#hero-rad)"/>

  <!-- Historic Sheet Music Background Engraving -->
  <g opacity="0.22" stroke="#182E28" stroke-width="1.2">
    <line x1="40" y1="60" x2="660" y2="60"/>
    <line x1="40" y1="72" x2="660" y2="72"/>
    <line x1="40" y1="84" x2="660" y2="84"/>
    <line x1="40" y1="96" x2="660" y2="96"/>
    <line x1="40" y1="108" x2="660" y2="108"/>

    <line x1="40" y1="420" x2="660" y2="420"/>
    <line x1="40" y1="432" x2="660" y2="432"/>
    <line x1="40" y1="444" x2="660" y2="444"/>
    <line x1="40" y1="456" x2="660" y2="456"/>
    <line x1="40" y1="468" x2="660" y2="468"/>
  </g>

  <!-- Central Composer Oval Portraits Collage -->
  <!-- Left portrait (Dvořák) -->
  <g transform="translate(180, 240) rotate(-6)">
    <ellipse cx="0" cy="0" rx="115" ry="145" fill="#FAF6F0" stroke="#8C775E" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="108" ry="138" fill="#182E28" opacity="0.1"/>
    <!-- Dvořák silhouette -->
    <path d="M -30 -60 Q 0 -85 30 -60 Q 55 -30 45 10 Q 30 50 0 55 Q -30 50 -45 10 Z" fill="#182E28"/>
    <!-- Beard & Suit -->
    <ellipse cx="0" cy="30" rx="25" ry="25" fill="#223F37"/>
    <path d="M -45 55 L 45 55 L 65 125 L -65 125 Z" fill="#182E28"/>
    <text x="0" y="115" font-family="'Playfair Display', serif" font-size="14" fill="#F5EFE6" font-weight="bold" text-anchor="middle">A. Dvořák</text>
  </g>

  <!-- Right portrait (Smetana - prominent) -->
  <g transform="translate(450, 230) rotate(5)">
    <ellipse cx="0" cy="0" rx="135" ry="165" fill="#FAF6F0" stroke="#C27845" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="126" ry="156" fill="#182E28" opacity="0.12"/>
    <!-- Smetana silhouette -->
    <path d="M -35 -70 Q 0 -100 35 -70 Q 65 -35 50 15 Q 35 60 0 65 Q -35 60 -50 15 Z" fill="#182E28"/>
    <!-- Glasses & Beard -->
    <circle cx="-15" cy="-25" r="10" fill="none" stroke="#FAF6F0" stroke-width="2"/>
    <circle cx="15" cy="-25" r="10" fill="none" stroke="#FAF6F0" stroke-width="2"/>
    <line x1="-5" y1="-25" x2="5" y2="-25" stroke="#FAF6F0" stroke-width="2"/>
    <path d="M -25 15 Q 0 45 25 15 Q 35 45 0 55 Q -35 45 -25 15 Z" fill="#223F37"/>
    <path d="M -60 65 L 60 65 L 85 140 L -85 140 Z" fill="#182E28"/>
    <text x="0" y="128" font-family="'Playfair Display', serif" font-size="16" fill="#F5EFE6" font-weight="bold" text-anchor="middle">B. Smetana</text>
  </g>

  <!-- Classical Clef Center Overlay -->
  <circle cx="320" cy="380" r="42" fill="#182E28" stroke="#8C775E" stroke-width="3"/>
  <text x="320" y="398" font-family="'Playfair Display', serif" font-size="52" fill="#C27845" text-anchor="middle">𝄞</text>
  <text x="320" y="445" font-family="'Playfair Display', serif" font-size="15" font-style="italic" fill="#8C775E" text-anchor="middle">„Hudba je život Čechů“</text>
</svg>